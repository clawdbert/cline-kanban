name: ck-prod

services:
  app:
    build: .
    container_name: ck-prod
    restart: unless-stopped
    ports:
      - "${CK_HOST_PORT:-3484}:${CK_CONTAINER_PORT:-3484}"
    environment:
      KANBAN_RUNTIME_HOST: "0.0.0.0"
      KANBAN_RUNTIME_PORT: "${CK_CONTAINER_PORT:-3484}"
      # Prepend host agent binaries to PATH using the same absolute paths as the host.
      PATH: "${CK_HOST_HOME}/.nvm/versions/node/${CK_NVM_NODE_VERSION:-v24.14.1}/bin:${CK_HOST_HOME}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    volumes:
      - kanban-data:/home/node/.cline
      # Projects — same path inside and outside so absolute paths in git and config are valid.
      - "${CK_PROJECTS_ROOT}:${CK_PROJECTS_ROOT}:rw"
      # Host agent tool directories — same path both sides, read-only.
      - "${CK_HOST_HOME}/.nvm:${CK_HOST_HOME}/.nvm:ro"
      - "${CK_HOST_HOME}/.local:${CK_HOST_HOME}/.local:ro"
    env_file:
      - .env.ck-prod

volumes:
  kanban-data:
    name: ck-prod-data
